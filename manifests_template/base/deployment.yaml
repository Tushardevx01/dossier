apiVersion: apps/v1
kind: Deployment
metadata:
  name: tushardevx01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tushardevx01
  template:
    metadata:
      labels:
        app: tushardevx01
    spec:
      containers:
        - name: app
          image: ghcr.io/example/repo:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
