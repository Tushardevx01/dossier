apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tushardevx01
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/<ORG_OR_USER>/<REPO>'
    targetRevision: manifests
    path: 'manifests/base'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
