name: CD - GitOps

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  packages: write

jobs:
  build-and-update-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and push image (tagged by sha)
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }}

      - name: Prepare manifests branch and update image
        env:
          MANIFESTS_BRANCH: manifests
          SHORT_SHA: ${{ github.sha }}
          IMAGE: ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          set -e

          if git ls-remote --heads origin $MANIFESTS_BRANCH; then
            git fetch origin $MANIFESTS_BRANCH:$MANIFESTS_BRANCH
            git checkout $MANIFESTS_BRANCH
          else
            git checkout --orphan $MANIFESTS_BRANCH
            git rm -rf . || true
          fi

          mkdir -p manifests/base
          if [ ! -f manifests/base/deployment.yaml ]; then
            cp -R manifests_template/base/* manifests/base/ || true
          fi

          # replace image line in deployment manifest
          if grep -q "image:" manifests/base/deployment.yaml; then
            sed -i "s|image: .*|image: ${IMAGE}|g" manifests/base/deployment.yaml
          else
            echo "image: ${IMAGE}" >> manifests/base/deployment.yaml
          fi

          git add manifests/base/deployment.yaml
          git commit -m "chore: update image ${SHORT_SHA}" || echo "no changes to commit"
          git push origin HEAD:$MANIFESTS_BRANCH

      - name: Output image
        run: echo "image=ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }}" >> $GITHUB_OUTPUT
